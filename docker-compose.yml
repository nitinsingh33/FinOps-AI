services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finops_ai
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finops_demo_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops -d finops_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://finops:${POSTGRES_PASSWORD:-finops_demo_local}@postgres:5432/finops_ai
      ASYNC_DATABASE_URL: postgresql+asyncpg://finops:${POSTGRES_PASSWORD:-finops_demo_local}@postgres:5432/finops_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      AI_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://finops:${POSTGRES_PASSWORD:-finops_demo_local}@postgres:5432/finops_ai
      ASYNC_DATABASE_URL: postgresql+asyncpg://finops:${POSTGRES_PASSWORD:-finops_demo_local}@postgres:5432/finops_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      AI_ENABLED: "false"
    volumes:
      - ./backend/data/uploads:/app/data/uploads
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
